[package]
name = "wrapped-collector"
default-run = "wrapped-collector"
version = "0.1.0"
description = "Wrapped background collector: tray icon, platform event sources and the batched writer"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
wrapped-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-service-management = "0.3"

[dev-dependencies]
# Only for tests/dashboard_json.rs (the dashboard's summary = this CLI's JSON);
# never linked into the collector itself.
wrapped-dashboard = { path = "../../dashboard" }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_Storage_Packaging_Appx", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }

[features]
windows-launcher = []

[[bin]]
name = "wrapped"
path = "src/bin/wrapped.rs"
required-features = ["windows-launcher"]
