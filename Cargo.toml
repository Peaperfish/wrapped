# Root workspace. Any crate placed under crates/ joins automatically.
# `spikes/` is excluded: the M0 spike is macOS-only and has its own lockfile.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Peaperfish/wrapped"
