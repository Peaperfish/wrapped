# Root workspace. Any crate placed under crates/ joins automatically, plus the
# dashboard (Tauri backend; its web frontend lives in dashboard/ui/).
# `spikes/` is excluded: the M0 spike is macOS-only and has its own lockfile.
[workspace]
resolver = "3"
members = ["crates/*", "dashboard"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Peaperfish/wrapped"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
