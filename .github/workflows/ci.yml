name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Dashboard frontend (dashboard/ui): type-check and build. The build
      # also gives the dashboard crate a ui/dist to embed.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/ui/package-lock.json
      - name: npm ci
        working-directory: dashboard/ui
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: dashboard/ui
        run: npm run check
      - name: frontend build
        working-directory: dashboard/ui
        run: npm run build

      # Rust: the whole workspace (collector, core, dashboard).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt -q --all --check
      - name: cargo clippy
        run: cargo clippy -q --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test -q --workspace --no-fail-fast
      - name: Dashboard contrast
        run: node scripts/check-contrast.mjs
      - name: Package Windows release and report sizes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/build.ps1 -FrontendBuilt
      - name: Smoke test packaged Windows collector
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: python scripts/windows/smoke.py target/windows-package
      - name: Upload Windows package
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v7
        with:
          name: Wrapped-Windows-x64
          path: target/windows-package/
